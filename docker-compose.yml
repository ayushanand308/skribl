version: '3.8'
services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: skribldb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skribldb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app1:
    build: .
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/skribldb?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=testsecretkeyfordockertesting12345
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push && npx prisma db seed && npm start"

  app2:
    build: .
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/skribldb?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=testsecretkeyfordockertesting12345
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npm start"

  nginx:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    restart: always

volumes:
  pgdata:
